<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#FA8128">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MikanNet">
  <link rel="apple-touch-icon" href="/static/png/logo-128x128.png">
  <link rel="icon" href="/static/png/logo-128x128.png">
  <title>Admin — MikanNet</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/modals.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="admin-page">

  <div class="admin-header">
    <a href="/" class="admin-back"><svg class="back-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></a>
    <h2>Admin</h2>
    <div class="admin-header-spacer"></div>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="posts">Posts</button>
    <button class="admin-tab" data-tab="users">Usuários</button>
    <button class="admin-tab" data-tab="eleicao">Eleição</button>
  </div>

  <div id="actionsPosts">
    <div class="posts-search-wrap" id="postsSort">
      <input type="text" class="posts-search" id="postsSearch" placeholder="Buscar por @usuario ou legenda...">
      <button type="button" class="header-section-arrow" id="postsSortBtn" title="Ordenar" aria-label="Ordenar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="header-sort-menu" id="postsSortMenu" hidden>
        <button type="button" class="active" data-sort="recent">Mais recentes</button>
        <button type="button" data-sort="popular">Mais populares</button>
      </div>
    </div>
    <div class="admin-scrollrow">
      <div class="admin-post-filters">
        <button class="admin-filter active" data-filter="all">Todos</button>
        <button class="admin-filter" data-filter="image">Imagens</button>
        <button class="admin-filter" data-filter="video">Videos</button>
        <button class="admin-filter" data-filter="text">Textos</button>
      </div>
    </div>
    <div class="admin-scrollrow admin-post-actions-row">
      <button class="admin-btn outline" id="adminSelectAll">Selecionar todas</button>
      <button class="admin-btn danger" id="adminDeleteSelected">Excluir</button>
      <button class="admin-btn outline" id="adminRemoveLikes">Remover likes</button>
    </div>
    <span id="adminStatus"></span>
  </div>

  <div id="tabPosts">
    <div class="admin-grid" id="adminGrid"></div>
    <div class="admin-text-list" id="adminTextList"></div>
  </div>

  <div id="tabUsers" style="display:none">
    <div class="turnos-panel" style="margin-bottom: 0.75rem;">
      <div class="turnos-stats">
        <label class="turnos-stat" style="flex-direction: row; align-items: center; justify-content: space-between; width: 100%;">
          <span class="turnos-stat-label" style="font-size: 0.85rem;">Exigir aprovação de novos usuários</span>
          <span class="turnos-check"><input type="checkbox" id="settingRequireApproval">Ativar</span>
        </label>
      </div>
    </div>
    <div class="users-search-wrap">
      <input type="text" class="users-search" id="usersSearch" placeholder="Buscar usuário...">
      <span class="users-count" id="usersCount"></span>
    </div>
    <div class="users-list" id="usersList"></div>
  </div>

  <div id="tabEleicao" style="display:none">
    <div class="eleicao-layout">
      <div class="eleicao-content">
        <div id="subtabTurnos" style="display:none">
          <div class="turnos-panel">
            <div class="turnos-stats">
              <div class="turnos-stat">
                <span class="turnos-stat-label">Turno atual</span>
                <strong id="turnoNumber"></strong>
              </div>
              <div class="turnos-stat">
                <span class="turnos-stat-label">Imagens na disputa</span>
                <strong id="turnoActiveCount"></strong>
              </div>
            </div>
            <div class="turnos-stats">
              <label class="turnos-stat">
                <span class="turnos-stat-label">Passam para a próxima fase</span>
                <input type="number" id="turnoCutoff" value="3" min="1">
              </label>
              <label class="turnos-stat">
                <span class="turnos-stat-label">Modo voto único</span>
                <span class="turnos-check"><input type="checkbox" id="turnoSingleVote">Ativar</span>
              </label>
            </div>
            <div class="turnos-stats">
              <div class="turnos-stat">
                <button class="admin-btn danger" id="turnoAdvance">Avançar turno</button>
              </div>
              <div class="turnos-stat">
                <button class="admin-btn outline" id="turnoReset">Resetar turnos</button>
              </div>
            </div>
            <div class="turnos-history" id="turnosHistory"></div>
          </div>
          <div class="admin-grid" id="turnoGrid"></div>
        </div>

        <div id="subtabPosts">
          <div class="admin-scrollrow admin-post-actions-row" style="margin-bottom: 0.75rem;">
            <button class="admin-btn outline" id="adminSelectAllEleicaoPosts">Selecionar todas</button>
            <button class="admin-btn danger" id="adminDeleteSelectedEleicao">Excluir</button>
            <button class="admin-btn outline" id="adminRemoveLikesEleicao">Remover likes</button>
            <button class="admin-btn outline" id="adminExportCollageEleicao">Exportar collage</button>
            <button class="admin-btn outline" id="adminAddWinnerFromPosts">Vencedora</button>
          </div>
          <span id="adminStatusEleicao"></span>
          <div class="admin-grid" id="eleicaoPostsGrid"></div>
        </div>
      </div>

      <div class="admin-subtabs">
        <button class="admin-subtab active" data-subtab="posts">Posts</button>
        <button class="admin-subtab" data-subtab="turnos">Turnos</button>
      </div>
    </div>
  </div>

  <div class="admin-actions" id="actionsUsers" style="display:none"></div>

  <div class="confirm-overlay" id="confirmModal">
    <div class="confirm-card">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button id="confirmNo" class="confirm-btn">Não</button>
        <button id="confirmYes" class="confirm-btn danger">Excluir</button>
      </div>
    </div>
  </div>

  <div class="winner-modal-overlay" id="winnerModal">
    <div class="winner-modal-card">
      <h3>Adicionar Vencedora</h3>
      <div class="winner-modal-preview" id="winnerImages"></div>
      <div class="winner-modal-fields">
        <label class="winner-modal-label">
          <span>Legenda</span>
          <textarea id="winnerCaption" class="winner-modal-input" placeholder="Opcional" maxlength="200" rows="3"></textarea>
        </label>
        <label class="winner-modal-label">
          <span>Número</span>
          <input type="text" id="winnerNumber" class="winner-modal-input" placeholder="Ex: 0001" maxlength="10">
        </label>
        <label class="winner-modal-label">
          <span>Data</span>
          <input type="date" id="winnerDate" class="winner-modal-input">
        </label>
      </div>
      <div class="winner-modal-actions">
        <button id="winnerCancel" class="confirm-btn">Cancelar</button>
        <button id="winnerConfirm" class="confirm-btn" style="background: var(--btn-bg); color: #fff; border-color: var(--btn-bg);">Salvar</button>
      </div>
    </div>
  </div>

  <script src="/static/js/modals.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
